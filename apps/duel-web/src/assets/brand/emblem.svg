    <clipPath id="clipGen"><circle cx="54" cy="78" r="25"/></clipPath>
    <clipPath id="clipTyc"><circle cx="35" cy="39" r="25"/></clipPath>
    <clipPath id="clipInc"><circle cx="73" cy="39" r="25"/></clipPath>
  </defs>

  <circle cx="54" cy="54" r="51" fill="url(#badgeBg)" stroke="#0a0704" stroke-width="2"/>
