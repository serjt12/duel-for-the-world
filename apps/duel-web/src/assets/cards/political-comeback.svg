  <text x="80" y="97" font-family="Georgia, serif" font-weight="bold" font-size="9" fill="#2a2d33" text-anchor="middle" textLength="28" lengthAdjust="spacingAndGlyphs">R.I.P.</text>
  <text x="80" y="109" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#2a2d33" text-anchor="middle" textLength="36" lengthAdjust="spacingAndGlyphs">CAREER</text>
  <!-- grass -->
  <path d="M40 120 L44 112 L47 120 L50 113 L53 120 Z M107 120 L110 113 L113 120 L116 112 L120 120 Z" fill="#4f9a3a" stroke="#1c1b22" stroke-width="1.5" stroke-linejoin="round"/>
