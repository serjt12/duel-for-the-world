<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#f7a24a"/>
      <stop offset="1" stop-color="#9c2a18"/>
    </radialGradient>
    <g id="ballot">
      <rect x="-6" y="-9" width="12" height="18" rx="1" fill="#fdf6e3" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
      <rect x="-3.5" y="-6" width="4" height="4" fill="none" stroke="#1c1b22" stroke-width="1.2"/>
      <path d="M-3 -4 L-1.5 -2.5 L1 -6.5" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M-3.5 2 L3.5 2 M-3.5 5 L2 5" stroke="#b8a888" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- sunburst -->
  <g fill="#ffffff" opacity="0.13">
    <polygon points="80,50 30,0 52,0"/>
    <polygon points="80,50 98,0 122,0"/>
    <polygon points="80,50 160,8 160,32"/>
    <polygon points="80,50 0,20 0,44"/>
    <polygon points="80,50 160,68 160,92"/>
    <polygon points="80,50 0,82 0,106"/>
  </g>
  <!-- flames -->
