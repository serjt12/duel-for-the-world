  <path d="M89 22 L100 26 L89 30 Z" fill="#f4c542" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M79 20 L87 22" stroke="#1c1b22" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="83" cy="24.5" r="2.2" fill="#1c1b22"/>
  <circle cx="83.7" cy="23.8" r="0.7" fill="#fff"/>
