    <path d="M56 112 C54 102 62 98 62 90 C68 96 74 90 80 82 C86 90 92 96 98 90 C98 98 106 102 104 112 Z" fill="#fff0a8" stroke-width="2"/>
  </g>
  <!-- tail ballots -->
