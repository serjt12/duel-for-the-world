  <use href="#ballot" transform="translate(90 78) rotate(20)"/>
  <!-- flame wings -->
  <g fill="#e0561f" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
    <path d="M70 52 C50 58 22 52 6 28 C18 32 14 18 16 4 C26 16 32 8 40 0 C46 14 60 22 72 36 Z"/>
    <path d="M90 52 C110 58 138 52 154 28 C142 32 146 18 144 4 C134 16 128 8 120 0 C114 14 100 22 88 36 Z"/>
  </g>
  <!-- wings -->
  <use href="#ballot" transform="translate(28 20) rotate(-50)"/>
  <use href="#ballot" transform="translate(40 30) rotate(-58)"/>
  <use href="#ballot" transform="translate(36 12) rotate(-30)"/>
  <use href="#ballot" transform="translate(50 20) rotate(-36)"/>
  <use href="#ballot" transform="translate(56 38) rotate(-66)"/>
  <use href="#ballot" transform="translate(132 20) rotate(50)"/>
  <use href="#ballot" transform="translate(120 30) rotate(58)"/>
  <use href="#ballot" transform="translate(124 12) rotate(30)"/>
  <use href="#ballot" transform="translate(110 20) rotate(36)"/>
  <use href="#ballot" transform="translate(104 38) rotate(66)"/>
  <!-- body -->
  <path d="M80 30 C94 34 98 50 94 62 C92 70 86 76 80 78 C74 76 68 70 66 62 C62 50 66 34 80 30 Z" fill="#fdf6e3" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <rect x="73" y="46" width="14" height="14" rx="1" fill="#fff" stroke="#1c1b22" stroke-width="2"/>
  <path d="M75.5 53 L79.5 57.5 L86 47" fill="none" stroke="#c0392b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 66 L88 66 M74 71 L86 71" stroke="#b8a888" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M70 42 C71 38 74 35 77 34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- crest -->
  <path d="M72 18 C70 10 74 6 74 2 C78 8 78 10 80 12 C80 6 84 4 86 0 C88 8 86 12 88 16 Z" fill="#e0561f" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
