  <rect x="106" y="14" width="46" height="38" rx="2" fill="#1c1b22"/>
  <text x="129" y="26" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffd24a" text-anchor="middle" textLength="24" lengthAdjust="spacingAndGlyphs">YES</text>
  <text x="129" y="42" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ff5a4a" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">99.8%</text>
  <text x="129" y="50" font-family="Arial, sans-serif" font-size="6" fill="#8a8f9a" text-anchor="middle" textLength="26" lengthAdjust="spacingAndGlyphs">NO 0.2%</text>
