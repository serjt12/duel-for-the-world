<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#3f8fd0"/>
    </radialGradient>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="22" cy="18" rx="16" ry="6"/>
    <ellipse cx="32" cy="13" rx="9" ry="6"/>
    <ellipse cx="146" cy="100" rx="14" ry="5"/>
    <ellipse cx="18" cy="104" rx="12" ry="4"/>
  </g>
  <!-- airplane departing -->
  <path d="M60 30 C90 26 110 20 128 14" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round" opacity="0.9"/>
  <g transform="translate(140 11) rotate(-18)" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round">
    <path d="M-2 -6 L6 -3 L-2 0 Z" fill="#e8ecf2"/>
    <path d="M-2 6 L6 3 L-2 0 Z" fill="#c9ccd3"/>
    <path d="M-14 -2 L12 -2 C17 -2 17 2 12 2 L-14 2 Z" fill="#ffffff"/>
    <path d="M-14 -2 L-18 -7 L-12 -2 Z M-14 2 L-17 5 L-12 2 Z" fill="#e02b20"/>
  </g>
  <!-- open passport -->
  <g transform="rotate(-5 80 70)">
    <rect x="18" y="36" width="126" height="78" rx="6" fill="#2d3f7a" stroke="#1c1b22" stroke-width="3"/>
    <path d="M24 40 L78 40 L78 110 L24 110 Z" fill="#f4f1ea" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M82 40 L138 40 L138 110 L82 110 Z" fill="#f4f1ea" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="80" y1="38" x2="80" y2="112" stroke="#1c1b22" stroke-width="3"/>
    <!-- photo -->
    <rect x="30" y="48" width="22" height="28" fill="#cfd8e3" stroke="#1c1b22" stroke-width="2"/>
    <circle cx="41" cy="59" r="6" fill="#6b6f7a"/>
    <path d="M32 76 C33 69 37 67 41 67 C45 67 49 69 50 76 Z" fill="#6b6f7a"/>
    <g stroke="#8c8577" stroke-width="2" stroke-linecap="round">
      <line x1="56" y1="52" x2="72" y2="52"/>
      <line x1="56" y1="58" x2="70" y2="58"/>
      <line x1="56" y1="64" x2="72" y2="64"/>
      <line x1="30" y1="86" x2="72" y2="86"/>
      <line x1="30" y1="92" x2="64" y2="92"/>
      <line x1="30" y1="100" x2="72" y2="100"/>
      <line x1="88" y1="98" x2="132" y2="98"/>
      <line x1="88" y1="104" x2="120" y2="104"/>
    </g>
    <!-- invented emblem -->
    <path d="M110 48 L112.5 54 L119 54 L114 58 L116 64 L110 60.5 L104 64 L106 58 L101 54 L107.5 54 Z" fill="#d6c9a8" stroke="#8c8577" stroke-width="1"/>
  </g>
  <!-- EXPELLED stamp -->
  <g transform="rotate(-14 100 80)">
    <rect x="62" y="68" width="82" height="24" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#d62020" stroke-width="3.5"/>
    <rect x="66" y="72" width="74" height="16" rx="2" fill="none" stroke="#d62020" stroke-width="1.5"/>
    <text x="103" y="85.5" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" fill="#d62020" text-anchor="middle" textLength="68" lengthAdjust="spacingAndGlyphs">EXPELLED</text>
  </g>
  <!-- ink splats -->
  <g fill="#d62020">
    <circle cx="146" cy="60" r="2"/>
    <circle cx="58" cy="100" r="1.6"/>
  </g>
</svg>
