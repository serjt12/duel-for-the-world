<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#9fb2c6"/>
      <stop offset="1" stop-color="#2e3f52"/>
    </radialGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#000" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <rect width="160" height="120" fill="url(#dots)"/>
  <!-- spotlight -->
  <polygon points="40,0 84,0 108,120 10,120" fill="#fffbe6" opacity="0.14"/>
  <!-- poster -->
  <g transform="rotate(5 130 44)">
    <rect x="106" y="12" width="48" height="64" fill="#f2eee3" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <rect x="110" y="16" width="40" height="56" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="130" y="34" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#1c1b22" text-anchor="middle" textLength="34" lengthAdjust="spacingAndGlyphs">THEY</text>
    <text x="130" y="51" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#c0392b" text-anchor="middle" textLength="34" lengthAdjust="spacingAndGlyphs">FEAR</text>
    <text x="130" y="68" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#1c1b22" text-anchor="middle" textLength="26" lengthAdjust="spacingAndGlyphs">ME</text>
    <g fill="#e8dcb8" stroke="#1c1b22" stroke-width="1.2" opacity="0.9">
      <rect x="102" y="8" width="12" height="5" transform="rotate(-30 108 10)"/>
      <rect x="146" y="8" width="12" height="5" transform="rotate(30 152 10)"/>
    </g>
  </g>
  <!-- suit body -->
  <path d="M22 120 C24 98 38 90 54 88 L72 88 C88 90 100 98 102 120 Z" fill="#2c3e66" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M54 88 L63 104 L72 88 Z" fill="#fdf6e3" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
  <path d="M63 92 L60 96 L62 106 L64 106 L66 96 Z" fill="#c0392b" stroke="#1c1b22" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- pointing arm -->
  <path d="M90 100 L110 80" stroke="#1c1b22" stroke-width="15" stroke-linecap="round"/>
  <path d="M90 100 L110 80" stroke="#2c3e66" stroke-width="10" stroke-linecap="round"/>
  <path d="M108 74 C110 70 116 70 118 72 L128 68 C131 67 132 71 129 72 L120 76 C122 80 118 84 114 84 C110 84 106 80 108 74 Z" fill="#e2a982" stroke="#1c1b22" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- arm in sling -->
  <path d="M28 104 L78 98 L60 120 Z" fill="#f4f1ea" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M74 99 L78 88 M30 104 L50 88" fill="none" stroke="#1c1b22" stroke-width="5" stroke-linecap="round"/>
  <path d="M74 99 L78 88 M30 104 L50 88" fill="none" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="30" y="98" width="38" height="11" rx="5" fill="#fdfdf8" stroke="#1c1b22" stroke-width="2.5"/>
  <path d="M38 100 L38 107 M46 100 L46 107 M54 100 L54 107" stroke="#c8c4b8" stroke-width="1.5"/>
  <circle cx="72" cy="103" r="5" fill="#e2a982" stroke="#1c1b22" stroke-width="2.2"/>
  <!-- neck + head -->
  <rect x="55" y="76" width="16" height="13" fill="#c68d68" stroke="#1c1b22" stroke-width="3"/>
  <ellipse cx="63" cy="52" rx="23" ry="26" fill="#e2a982" stroke="#1c1b22" stroke-width="3"/>
  <!-- neat hair -->
  <path d="M40 50 C38 30 52 22 66 23 C80 24 88 32 86 46 C80 36 70 34 62 36 C56 34 50 38 46 46 C44 44 42 46 40 50 Z" fill="#5a3a22" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 28 Q70 25 78 30" fill="none" stroke="#9a6a44" stroke-width="2" stroke-linecap="round"/>
  <!-- forehead bandage -->
  <g transform="rotate(-18 72 40)">
    <rect x="63" y="36" width="18" height="7" rx="2.5" fill="#f2d4b0" stroke="#1c1b22" stroke-width="2"/>
    <rect x="69" y="37" width="6" height="5" fill="#fbeedd"/>
  </g>
  <!-- tragic brows + eyes looking up -->
  <path d="M48 50 Q53 44 59 46 M68 46 Q74 44 79 50" fill="none" stroke="#3a2418" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="54" cy="54" rx="4" ry="4.5" fill="#fff" stroke="#1c1b22" stroke-width="2"/>
  <ellipse cx="73" cy="54" rx="4" ry="4.5" fill="#fff" stroke="#1c1b22" stroke-width="2"/>
  <circle cx="55.5" cy="52.5" r="2" fill="#1c1b22"/>
  <circle cx="74.5" cy="52.5" r="2" fill="#1c1b22"/>
  <!-- single theatrical tear -->
  <path d="M77 59 C75 63 74 65 74 67 A3 3 0 0 0 80 67 C80 65 79 63 77 59 Z" fill="#8fd3f4" stroke="#1c1b22" stroke-width="1.6"/>
  <path d="M76 65 L76 67" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <!-- nose + trembling mouth -->
  <path d="M63 56 C66 61 66 63 63 64" fill="none" stroke="#1c1b22" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M55 70 Q58 67 61 70 Q64 67 67 70 Q70 67 72 70" fill="none" stroke="#1c1b22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="48" cy="63" r="3.5" fill="#e8847a" opacity="0.5"/>
</svg>
