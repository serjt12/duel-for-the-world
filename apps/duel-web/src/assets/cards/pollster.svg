  <path d="M58 30 Q62 27 66 29 M74 26 Q78 24 82 27" fill="none" stroke="#5a4030" stroke-width="2" stroke-linecap="round"/>
  <!-- headset band + ear cups -->
  <path d="M46 56 C42 22 98 22 94 56" fill="none" stroke="#1c1b22" stroke-width="7" stroke-linecap="round"/>
  <path d="M46 56 C42 22 98 22 94 56" fill="none" stroke="#555a66" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="41" y="50" width="10" height="16" rx="4" fill="#3a3f4a" stroke="#1c1b22" stroke-width="2.5"/>
  <rect x="89" y="50" width="10" height="16" rx="4" fill="#3a3f4a" stroke="#1c1b22" stroke-width="2.5"/>
