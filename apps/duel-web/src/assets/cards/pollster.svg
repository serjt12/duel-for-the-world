  </g>
  <path d="M68.5 55 L72.5 55" stroke="#1c1b22" stroke-width="2.2"/>
  <circle cx="62" cy="55" r="2.3" fill="#1c1b22"/>
  <circle cx="79" cy="55" r="2.3" fill="#1c1b22"/>
  <!-- knowing smile -->
