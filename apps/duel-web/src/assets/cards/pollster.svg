  <path d="M104 112 L100 102" stroke="#1c1b22" stroke-width="13" stroke-linecap="round"/>
  <path d="M104 112 L100 102" stroke="#d99a2b" stroke-width="8" stroke-linecap="round"/>
  <rect x="93" y="92" width="15" height="13" rx="5" fill="#b87a50" stroke="#1c1b22" stroke-width="2.5"/>
