  <path d="M112 6 L148 6 C154 6 157 10 157 15 L157 25 C157 30 154 34 148 34 L116 34 L104 42 L108 33 C104 32 103 29 103 25 L103 15 C103 10 106 6 112 6 Z" fill="#ffffff" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="130" y="27" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#3a2f9a" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">&#177;3%</text>
</svg>
