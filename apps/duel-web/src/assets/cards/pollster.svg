      <stop offset="0" stop-color="#7f78e0"/>
      <stop offset="1" stop-color="#262266"/>
    </radialGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#000" opacity="0.15"/>
