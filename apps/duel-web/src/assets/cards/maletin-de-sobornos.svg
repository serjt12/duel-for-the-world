    <rect x="104" y="66" width="12" height="9" rx="1.5"/>
  </g>
  <!-- stitching -->
  <path d="M34 106 L126 106" stroke="#c48a55" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- luggage tag -->
  <g stroke="#1c1b22" stroke-width="2" stroke-linejoin="round">
    <path d="M122 82 C136 80 140 88 146 92" fill="none" stroke-width="1.5"/>
    <path d="M140 88 L154 94 L150 106 L136 100 Z" fill="#f4f1ea"/>
  </g>
  <text x="145" y="100" font-family="Georgia, serif" font-size="6" fill="#1c1b22" text-anchor="middle" transform="rotate(22 145 98)">shh</text>
</svg>
