<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#4f9a64"/>
      <stop offset="1" stop-color="#17372a"/>
    </radialGradient>
    <g id="bill">
      <rect x="-14" y="-7" width="28" height="14" rx="1.5" fill="#8fd18a" stroke="#1c1b22" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#2e6b3a" stroke-width="1.5"/>
      <text x="0" y="2.6" font-family="Arial, sans-serif" font-weight="bold" font-size="7" fill="#2e6b3a" text-anchor="middle">$</text>
    </g>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- sparkles -->
  <g fill="#fff6c8">
    <path d="M22 22 L24 28 L30 30 L24 32 L22 38 L20 32 L14 30 L20 28 Z"/>
    <path d="M140 16 L141.5 20.5 L146 22 L141.5 23.5 L140 28 L138.5 23.5 L134 22 L138.5 20.5 Z"/>
    <path d="M146 76 L147.5 80 L152 81.5 L147.5 83 L146 87 L144.5 83 L140 81.5 L144.5 80 Z"/>
  </g>
  <!-- flying bills -->
  <use href="#bill" transform="translate(46 22) rotate(-24)"/>
  <use href="#bill" transform="translate(112 18) rotate(18)"/>
  <use href="#bill" transform="translate(130 48) rotate(-10)"/>
  <use href="#bill" transform="translate(26 58) rotate(14)"/>
  <!-- open lid -->
  <path d="M34 56 L42 30 L118 30 L126 56 Z" fill="#6b3f1f" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M44 34 L116 34 L121 52 L39 52 Z" fill="#8a5530" stroke="#1c1b22" stroke-width="2"/>
  <!-- cash stacks -->
  <g stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
    <rect x="40" y="46" width="24" height="16" fill="#8fd18a"/>
    <rect x="64" y="44" width="24" height="18" fill="#7cc377"/>
    <rect x="88" y="46" width="24" height="16" fill="#8fd18a"/>
    <rect x="112" y="48" width="12" height="14" fill="#7cc377"/>
  </g>
  <g fill="#f4c542" stroke="#1c1b22" stroke-width="1.5">
    <rect x="48" y="46" width="6" height="16"/>
    <rect x="73" y="44" width="6" height="18"/>
    <rect x="97" y="46" width="6" height="16"/>
  </g>
  <!-- case body -->
  <path d="M28 60 L132 60 L132 108 C132 112 128 114 124 114 L36 114 C32 114 28 112 28 108 Z" fill="#7a4a24" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M28 70 L132 70" stroke="#1c1b22" stroke-width="2.5"/>
  <path d="M34 64 L126 64" stroke="#a36a3b" stroke-width="2" stroke-linecap="round"/>
