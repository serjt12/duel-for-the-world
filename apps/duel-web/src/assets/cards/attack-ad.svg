<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#8a1c1c"/>
      <stop offset="1" stop-color="#140608"/>
    </radialGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
      <circle cx="1" cy="2" r="0.5" fill="#fff" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- ominous rays -->
  <g fill="#ff3b30" opacity="0.13">
    <polygon points="80,60 0,0 30,0"/>
    <polygon points="80,60 130,0 160,0"/>
    <polygon points="80,60 0,90 0,120"/>
    <polygon points="80,60 160,95 160,120"/>
  </g>
  <!-- antennas -->
  <g stroke="#1c1b22" stroke-width="3" stroke-linecap="round">
    <path d="M78 16 L58 2"/>
    <path d="M82 16 L104 3"/>
  </g>
  <circle cx="58" cy="3" r="3" fill="#c9ccd3" stroke="#1c1b22" stroke-width="2"/>
  <circle cx="104" cy="4" r="3" fill="#c9ccd3" stroke="#1c1b22" stroke-width="2"/>
  <ellipse cx="80" cy="18" rx="9" ry="4" fill="#3a3f4a" stroke="#1c1b22" stroke-width="2.5"/>
  <!-- tv cabinet -->
  <rect x="14" y="20" width="132" height="90" rx="10" fill="#7a4a24" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M22 26 L136 26" stroke="#a36a3b" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#3a3f4a" stroke="#1c1b22" stroke-width="2.5">
    <rect x="30" y="108" width="12" height="8" rx="2"/>
    <rect x="118" y="108" width="12" height="8" rx="2"/>
  </g>
  <!-- screen -->
  <rect x="22" y="30" width="96" height="72" rx="12" fill="#9a9aa0" stroke="#1c1b22" stroke-width="3"/>
  <!-- grainy silhouette -->
  <circle cx="58" cy="60" r="13" fill="#3b3b40"/>
  <path d="M34 102 C36 84 46 78 58 78 C70 78 80 84 82 102 Z" fill="#3b3b40"/>
  <path d="M55 79 L58 96 L61 79 Z" fill="#6b1a1a"/>
  <path d="M50 57 L56 60 M66 57 L60 60" stroke="#9a9aa0" stroke-width="2" stroke-linecap="round"/>
  <rect x="22" y="30" width="96" height="72" rx="12" fill="url(#scan)"/>
  <!-- scary text -->
  <rect x="26" y="34" width="88" height="15" fill="#1c1b22"/>
  <text x="70" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="12" fill="#ff3b30" text-anchor="middle" textLength="80" lengthAdjust="spacingAndGlyphs">DANGEROUS?</text>
  <!-- red arrow -->
  <path d="M112 90 L98 76 L103 72 L86 66 L89 83 L93 79 L107 95 Z" fill="#e02b20" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30 94 C27 88 26 80 26 72" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- knobs + speaker -->
  <g stroke="#1c1b22" stroke-width="2.5">
    <circle cx="132" cy="44" r="7" fill="#c9ccd3"/>
    <circle cx="132" cy="64" r="5" fill="#c9ccd3"/>
  </g>
  <path d="M132 38 L132 44" stroke="#1c1b22" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#3a2412" stroke-width="2" stroke-linecap="round">
    <line x1="125" y1="78" x2="139" y2="78"/>
    <line x1="125" y1="84" x2="139" y2="84"/>
    <line x1="125" y1="90" x2="139" y2="90"/>
    <line x1="125" y1="96" x2="139" y2="96"/>
  </g>
  <circle cx="132" cy="104" r="1.8" fill="#ff3b30" stroke="#1c1b22" stroke-width="1"/>
</svg>
