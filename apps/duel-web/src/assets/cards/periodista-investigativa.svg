  <path d="M54 88 L62 104 L48 120 M80 88 L72 104 L86 120" fill="none" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- lanyard + press badge -->
  <path d="M59 90 L64 100 M75 90 L70 100" stroke="#c0392b" stroke-width="2.5"/>
  <g transform="rotate(-4 67 110)">
    <rect x="49" y="100" width="36" height="20" rx="2" fill="#f4f1ea" stroke="#1c1b22" stroke-width="2.5"/>
    <rect x="49" y="100" width="36" height="6" fill="#c0392b" stroke="#1c1b22" stroke-width="2"/>
    <text x="67" y="116" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#1c1b22" text-anchor="middle" textLength="30" lengthAdjust="spacingAndGlyphs">PRENSA</text>
  </g>
  <!-- neck -->
  <rect x="60" y="76" width="14" height="13" fill="#c98f66" stroke="#1c1b22" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="67" cy="56" rx="21" ry="24" fill="#e0a77c" stroke="#1c1b22" stroke-width="3"/>
  <!-- fringe -->
  <path d="M45 54 C43 34 55 28 68 28 C81 28 91 35 89 52 C82 46 76 40 72 35 C66 44 55 50 45 54 Z" fill="#6b2e1f" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M74 32 Q80 34 84 38" fill="none" stroke="#a34a30" stroke-width="2" stroke-linecap="round"/>
  <!-- determined brows -->
  <path d="M51 47 L63 51 M83 47 L71 51" stroke="#3a1a12" stroke-width="3.2" stroke-linecap="round"/>
