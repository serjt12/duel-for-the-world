      <circle cx="12" cy="82" r="2.3"/>
      <circle cx="20" cy="82" r="2.3"/>
      <circle cx="28" cy="82" r="2.3"/>
    </g>
  </g>
  <!-- sound waves -->
  <g fill="none" stroke="#cfe0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M144 30 Q150 40 146 50"/>
    <path d="M151 24 Q160 40 153 56"/>
