  </g>
  <path d="M12 22 Q14 18 18 17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- back hair (bob) -->
  <path d="M39 60 C35 32 52 22 67 22 C83 22 99 32 95 60 C95 70 94 76 91 81 L43 81 C40 76 39 70 39 60 Z" fill="#6b2e1f" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <!-- trench coat -->
  <path d="M22 120 C24 98 38 90 56 88 L78 88 C96 90 106 98 108 120 Z" fill="#c9a46a" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
