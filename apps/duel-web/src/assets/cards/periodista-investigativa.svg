<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#3d5c94"/>
      <stop offset="1" stop-color="#0f1730"/>
    </radialGradient>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- spotlight rays -->
  <g fill="#cfe0ff" opacity="0.1">
    <polygon points="66,56 20,0 42,0"/>
    <polygon points="66,56 76,0 98,0"/>
    <polygon points="66,56 160,0 160,20"/>
    <polygon points="66,56 0,30 0,52"/>
    <polygon points="66,56 160,96 160,120"/>
  </g>
  <!-- magnifying glass -->
  <g stroke="#1c1b22" stroke-linejoin="round">
    <path d="M26 36 L34 44" stroke-width="7" stroke-linecap="round"/>
    <path d="M26 36 L34 44" stroke="#8a5530" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="18" cy="26" r="11" fill="#cfe8ff" fill-opacity="0.35" stroke-width="3"/>
