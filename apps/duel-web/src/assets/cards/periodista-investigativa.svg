  <g stroke="#1c1b22" stroke-width="2.5">
    <circle cx="58" cy="57" r="7" fill="#cfe8ff" fill-opacity="0.35"/>
    <circle cx="76" cy="57" r="7" fill="#cfe8ff" fill-opacity="0.35"/>
    <path d="M65 56 Q67 54 69 56" fill="none"/>
    <path d="M51 56 L46 54 M83 56 L88 54" fill="none"/>
  </g>
  <circle cx="59" cy="58" r="2.4" fill="#1c1b22"/>
  <circle cx="75" cy="58" r="2.4" fill="#1c1b22"/>
  <path d="M54 53 L56 51 M72 53 L74 51" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- nose + smirk -->
  <path d="M67 60 C69 64 69 66 66 67" fill="none" stroke="#1c1b22" stroke-width="2" stroke-linecap="round"/>
  <path d="M59 72 Q67 74 76 69" fill="none" stroke="#1c1b22" stroke-width="2.6" stroke-linecap="round"/>
  <!-- arm holding recorder out -->
  <path d="M98 106 L116 84" stroke="#1c1b22" stroke-width="14" stroke-linecap="round"/>
  <path d="M98 106 L116 84" stroke="#c9a46a" stroke-width="9" stroke-linecap="round"/>
  <!-- recorder -->
  <g transform="rotate(12 126 60)" stroke="#1c1b22" stroke-linejoin="round">
    <rect x="113" y="30" width="26" height="54" rx="6" fill="#3a3f4a" stroke-width="3"/>
    <rect x="117" y="34" width="18" height="14" rx="3" fill="#555a66" stroke-width="2"/>
    <path d="M120 38 L132 38 M120 41 L132 41 M120 44 L132 44" stroke="#2b2f36" stroke-width="1.5"/>
    <rect x="117" y="52" width="18" height="11" rx="1.5" fill="#1c1b22" stroke-width="1.5"/>
    <circle cx="121" cy="57.5" r="4" fill="#ff3b30" stroke="none" opacity="0.35"/>
    <circle cx="121" cy="57.5" r="2.4" fill="#ff3b30" stroke="none"/>
    <text x="130" y="60" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#ff3b30" stroke="none" text-anchor="middle">REC</text>
    <rect x="113" y="70" width="18" height="16" rx="6" fill="#e0a77c" stroke-width="2.5"/>
    <path d="M115 75 L129 75 M115 80 L129 80" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <path d="M121 36 L118 50" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- notepad -->
  <g transform="rotate(-10 20 98)" stroke="#1c1b22" stroke-linejoin="round">
    <rect x="6" y="82" width="28" height="34" rx="2" fill="#fdf6e3" stroke-width="2.5"/>
    <path d="M11 92 L29 92 M11 98 L29 98 M11 104 L25 104 M11 110 L28 110" stroke="#6b8fd1" stroke-width="1.5" stroke-linecap="round"/>
