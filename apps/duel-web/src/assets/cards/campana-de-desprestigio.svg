  <g fill="#e0301e" stroke="#1c1b22" stroke-width="1.8" stroke-linejoin="round">
    <path d="M34 30 L30 18 L39 27 Z"/>
    <path d="M54 30 L58 18 L49 27 Z"/>
  </g>
  <circle cx="39.5" cy="42" r="1.8" fill="#1c1b22"/>
  <circle cx="48.5" cy="42" r="1.8" fill="#1c1b22"/>
  <path d="M40 51 C42 53 46 53 48 51" fill="none" stroke="#1c1b22" stroke-width="1.5" stroke-linecap="round"/>
  <!-- drawn-on mustache -->
  <path d="M35 46 C33 50 37 51 40 49 C42 47 44 47 44 48 C44 47 46 47 48 49 C51 51 55 50 53 46" fill="none" stroke="#111" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- slogan -->
  <text x="108" y="33" font-family="Georgia, serif" font-weight="bold" font-size="11" fill="#1d3fa0" text-anchor="middle" textLength="52" lengthAdjust="spacingAndGlyphs">CONFÍE</text>
  <text x="108" y="46" font-family="Georgia, serif" font-weight="bold" font-size="11" fill="#1d3fa0" text-anchor="middle" textLength="36" lengthAdjust="spacingAndGlyphs">EN MÍ</text>
  <!-- sprayed NO -->
  <g transform="rotate(-12 108 58)">
    <text x="108" y="75" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#e0301e" stroke="#1c1b22" stroke-width="1.5" text-anchor="middle" textLength="56" lengthAdjust="spacingAndGlyphs">NO</text>
  </g>
  <!-- drips -->
  <g stroke="#e0301e" stroke-width="3.2" stroke-linecap="round">
    <line x1="88" y1="74" x2="88" y2="90"/>
    <line x1="98" y1="72" x2="98" y2="84"/>
    <line x1="118" y1="68" x2="118" y2="96"/>
    <line x1="128" y1="66" x2="128" y2="80"/>
