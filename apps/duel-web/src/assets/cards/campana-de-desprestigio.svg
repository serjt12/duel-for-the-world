    <rect x="116" y="80" width="8" height="36"/>
  </g>
  <!-- lamps -->
  <g stroke="#1c1b22" stroke-width="2" stroke-linejoin="round">
    <path d="M44 12 L44 6 L52 6" fill="none"/>
    <path d="M116 12 L116 6 L108 6" fill="none"/>
    <path d="M50 2 L58 4 L56 10 L48 8 Z" fill="#555a66"/>
    <path d="M110 2 L102 4 L104 10 L112 8 Z" fill="#555a66"/>
  </g>
  <!-- board -->
