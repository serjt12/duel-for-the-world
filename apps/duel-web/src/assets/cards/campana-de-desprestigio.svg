  <path d="M141 100 L140 112" stroke="#eef0f4" stroke-width="2" stroke-linecap="round"/>
  <!-- brush -->
  <g transform="rotate(-18 76 110)" stroke="#1c1b22" stroke-width="2.2" stroke-linejoin="round">
    <rect x="52" y="106" width="30" height="6" rx="3" fill="#8a5530"/>
    <rect x="82" y="104" width="8" height="10" fill="#b8bcc6"/>
    <path d="M90 103 L100 104 L100 114 L90 115 Z" fill="#e0301e"/>
