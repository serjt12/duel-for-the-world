  <path d="M20 73 C22 60 32 56 44 56 C56 56 66 60 68 73 Z" fill="#2b2f36" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M38 56 L44 64 L50 56 Z" fill="#fbfbfb" stroke="#1c1b22" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M42 60 L46 60 L47 72 L44 74 L41 72 Z" fill="#1d3fa0" stroke="#1c1b22" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="44" cy="42" rx="12" ry="14" fill="#e0b088" stroke="#1c1b22" stroke-width="2.5"/>
  <path d="M32 40 C30 28 40 25 46 26 C54 27 58 32 56 40 C52 34 46 33 40 35 C36 36 33 38 32 40 Z" fill="#3a2a1e" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
