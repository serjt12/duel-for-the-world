      <stop offset="0" stop-color="#7a2c2c"/>
      <stop offset="1" stop-color="#1e1618"/>
    </radialGradient>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- paint splatter -->
  <g fill="#e0301e" opacity="0.35">
    <circle cx="6" cy="10" r="3"/>
    <circle cx="154" cy="96" r="2.5"/>
    <circle cx="8" cy="92" r="2"/>
    <circle cx="150" cy="8" r="1.8"/>
    <circle cx="80" cy="100" r="2"/>
  </g>
  <!-- ground -->
  <path d="M0 112 C40 108 120 108 160 112 L160 120 L0 120 Z" fill="#141013"/>
  <!-- posts -->
  <g fill="#555a66" stroke="#1c1b22" stroke-width="2.5">
