<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#8e5bb5"/>
      <stop offset="1" stop-color="#2e1a47"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4c2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- spotlight beam -->
  <polygon points="66,0 94,0 138,120 22,120" fill="url(#beam)"/>
  <!-- confetti -->
  <g stroke="#1c1b22" stroke-width="1">
    <rect x="18" y="20" width="5" height="8" fill="#f4c542" transform="rotate(25 20 24)"/>
    <rect x="138" y="28" width="5" height="8" fill="#e74c3c" transform="rotate(-30 140 32)"/>
    <rect x="30" y="56" width="4" height="7" fill="#3fa9f5" transform="rotate(-15 32 60)"/>
    <rect x="128" y="62" width="4" height="7" fill="#f4c542" transform="rotate(40 130 66)"/>
    <rect x="146" y="10" width="4" height="7" fill="#3fa9f5" transform="rotate(10 148 14)"/>
  </g>
  <!-- body -->
  <path d="M46 120 C48 94 60 86 74 84 L86 84 C100 86 112 94 114 120 Z" fill="#d35400" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
