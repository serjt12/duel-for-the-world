  <g stroke="#1c1b22" stroke-width="2.5">
    <path d="M70 92 L76 76" fill="none"/>
    <path d="M90 92 L84 76" fill="none"/>
    <ellipse cx="77" cy="74" rx="4" ry="5" fill="#555a66" transform="rotate(20 77 74)"/>
    <ellipse cx="83" cy="74" rx="4" ry="5" fill="#555a66" transform="rotate(-20 83 74)"/>
  </g>
  <!-- podium -->
  <g stroke="#1c1b22" stroke-width="3" stroke-linejoin="round">
    <path d="M48 92 L112 92 L106 120 L54 120 Z" fill="#6b3f1f"/>
    <rect x="44" y="88" width="72" height="8" rx="2" fill="#8a5530"/>
