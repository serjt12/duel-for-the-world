  <path d="M104 94 L126 52" stroke="#1c1b22" stroke-width="13" stroke-linecap="round"/>
  <path d="M104 94 L126 52" stroke="#d35400" stroke-width="8" stroke-linecap="round"/>
  <path d="M121 49 C118 40 122 34 128 36 L131 30 C133 26 138 28 136 33 L134 38 C139 38 140 44 136 48 C133 53 125 54 121 49 Z" fill="#8d5a3b" stroke="#1c1b22" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="73" y="74" width="14" height="11" fill="#7a4a30" stroke="#1c1b22" stroke-width="3"/>
  <!-- big curly hair back -->
  <g fill="#1d1410" stroke="#1c1b22" stroke-width="2.5">
    <circle cx="58" cy="44" r="12"/>
    <circle cx="102" cy="44" r="12"/>
    <circle cx="60" cy="64" r="11"/>
    <circle cx="100" cy="64" r="11"/>
    <circle cx="68" cy="30" r="12"/>
    <circle cx="92" cy="30" r="12"/>
    <circle cx="80" cy="26" r="12"/>
  </g>
  <!-- head -->
  <ellipse cx="80" cy="54" rx="21" ry="24" fill="#8d5a3b" stroke="#1c1b22" stroke-width="3"/>
  <!-- bangs -->
  <path d="M60 46 C62 34 72 30 80 30 C90 30 99 35 100 46 C94 40 88 38 82 42 C76 38 66 40 60 46 Z" fill="#1d1410" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- earrings -->
  <circle cx="59" cy="62" r="3.5" fill="#f4c542" stroke="#1c1b22" stroke-width="1.8"/>
  <circle cx="101" cy="62" r="3.5" fill="#f4c542" stroke="#1c1b22" stroke-width="1.8"/>
  <!-- confident brows, eyes -->
  <path d="M66 49 Q71 45 76 48 M84 48 Q89 45 94 49" fill="none" stroke="#1c1b22" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M67 55 Q71 52 75 55" fill="none" stroke="#1c1b22" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M85 55 Q89 52 93 55" fill="none" stroke="#1c1b22" stroke-width="2.6" stroke-linecap="round"/>
  <!-- speaking smile -->
  <path d="M70 64 Q80 76 90 64 Z" fill="#fff" stroke="#1c1b22" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M73 68 Q80 73 87 68" fill="#c0392b"/>
