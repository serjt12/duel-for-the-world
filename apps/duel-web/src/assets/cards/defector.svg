    <ellipse cx="75" cy="32" rx="4.5" ry="5" fill="#fff" stroke="#1c1b22" stroke-width="2"/>
    <ellipse cx="89" cy="32" rx="4.5" ry="5" fill="#fff" stroke="#1c1b22" stroke-width="2"/>
