    <radialGradient id="bg2" cx="0.7" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#4f86d6"/>
      <stop offset="1" stop-color="#14285e"/>
    </radialGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
