    <path d="M74 45 Q82 50 90 44 Z" fill="#fdf6e3" stroke="#1c1b22" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="68" cy="40" r="3.5" fill="#e8847a" opacity="0.5"/>
