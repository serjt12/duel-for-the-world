    <path d="M72 58 L80 72 L88 58 Z" fill="#f4f1ea" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
    <path d="M78 61 L82 61 L83.5 76 L80 81 L76.5 76 Z" fill="#8e44ad" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
