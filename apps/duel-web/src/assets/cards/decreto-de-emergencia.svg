<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#1f5a4a"/>
    </linearGradient>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff6c8">
    <circle cx="14" cy="14" r="1.4"/>
    <circle cx="40" cy="8" r="1"/>
    <circle cx="28" cy="34" r="1.2"/>
    <circle cx="150" cy="60" r="1.2"/>
    <circle cx="112" cy="10" r="1"/>
    <circle cx="10" cy="70" r="1"/>
  </g>
  <!-- moon -->
  <circle cx="134" cy="24" r="14" fill="#f7e7a1" stroke="#1c1b22" stroke-width="2.5"/>
  <circle cx="141" cy="19" r="12" fill="#16324a"/>
  <!-- clock -->
  <g stroke="#1c1b22" stroke-width="2.5">
    <circle cx="26" cy="92" r="16" fill="#f4f1ea"/>
    <circle cx="26" cy="92" r="12" fill="none" stroke-width="1" opacity="0.4"/>
    <line x1="26" y1="92" x2="26" y2="80" stroke-width="3" stroke-linecap="round"/>
    <line x1="26" y1="92" x2="27" y2="83" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="26" cy="92" r="2" fill="#c0392b"/>
  <text x="26" y="118" font-family="Georgia, serif" font-weight="bold" font-size="8" fill="#f7e7a1" text-anchor="middle">00:00</text>
  <!-- document -->
  <g transform="rotate(-6 82 64)">
    <path d="M50 18 L112 18 L112 108 L50 108 Z" fill="#fbf6e8" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <rect x="50" y="18" width="62" height="12" fill="#2f7d5c" stroke="#1c1b22" stroke-width="3"/>
    <text x="81" y="27.5" font-family="Georgia, serif" font-weight="bold" font-size="8" fill="#fbf6e8" text-anchor="middle">DECRETO</text>
    <g stroke="#9a9384" stroke-width="2" stroke-linecap="round">
      <line x1="58" y1="40" x2="104" y2="40"/>
      <line x1="58" y1="47" x2="100" y2="47"/>
      <line x1="58" y1="54" x2="104" y2="54"/>
      <line x1="58" y1="61" x2="94" y2="61"/>
      <line x1="58" y1="68" x2="102" y2="68"/>
    </g>
    <!-- signature scribble -->
    <path d="M60 96 C64 86 68 100 72 92 C75 86 78 98 82 92 C85 88 88 94 92 90" fill="none" stroke="#1d3fa0" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="99" x2="98" y2="99" stroke="#9a9384" stroke-width="1.5"/>
  </g>
  <!-- stamp -->
  <g transform="rotate(-18 92 74)">
    <rect x="62" y="64" width="62" height="18" rx="3" fill="#fbf6e8" fill-opacity="0.35" stroke="#d2322d" stroke-width="3.5"/>
    <text x="93" y="77.5" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="#d2322d" text-anchor="middle" textLength="52" lengthAdjust="spacingAndGlyphs">URGENTE</text>
  </g>
  <!-- fountain pen -->
  <g transform="rotate(38 128 82)" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
    <rect x="122" y="52" width="12" height="36" rx="4" fill="#1b1b1f"/>
    <rect x="122" y="70" width="12" height="4" fill="#e0a722"/>
    <path d="M123 88 L133 88 L128 104 Z" fill="#e0a722"/>
    <line x1="128" y1="92" x2="128" y2="102" stroke-width="1.2"/>
  </g>
  <circle cx="113" cy="104" r="3" fill="#1d3fa0"/>
</svg>
