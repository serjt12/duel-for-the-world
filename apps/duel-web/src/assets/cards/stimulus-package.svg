<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#ecd068"/>
      <stop offset="1" stop-color="#2f6b34"/>
    </radialGradient>
    <g id="bill">
      <rect x="-13" y="-6.5" width="26" height="13" rx="1.5" fill="#8fd18a" stroke="#1c1b22" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.8" fill="none" stroke="#2e6b3a" stroke-width="1.4"/>
      <text x="0" y="2.5" font-family="Arial, sans-serif" font-weight="bold" font-size="6.5" fill="#2e6b3a" text-anchor="middle">$</text>
    </g>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- sunburst -->
  <g fill="#ffffff" opacity="0.13">
    <polygon points="60,60 20,0 44,0"/>
    <polygon points="60,60 84,0 108,0"/>
    <polygon points="60,60 160,0 160,24"/>
    <polygon points="60,60 0,30 0,54"/>
    <polygon points="60,60 0,96 0,120"/>
    <polygon points="60,60 160,110 160,120 140,120"/>
  </g>
  <g fill="#fff6c8">
    <path d="M16 14 L18 20 L24 22 L18 24 L16 30 L14 24 L8 22 L14 20 Z"/>
    <path d="M110 10 L111.5 14.5 L116 16 L111.5 17.5 L110 22 L108.5 17.5 L104 16 L108.5 14.5 Z"/>
  </g>
  <!-- bills poking out -->
  <use href="#bill" transform="translate(22 58) rotate(-28)"/>
  <use href="#bill" transform="translate(38 52) rotate(-12)"/>
  <use href="#bill" transform="translate(96 54) rotate(18)"/>
  <use href="#bill" transform="translate(84 50) rotate(4)"/>
  <!-- box body -->
  <rect x="22" y="62" width="76" height="50" fill="#c0392b" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <rect x="53" y="62" width="14" height="50" fill="#f4c542" stroke="#1c1b22" stroke-width="2.5"/>
  <path d="M27 68 L27 106" stroke="#e46a52" stroke-width="2.5" stroke-linecap="round"/>
  <!-- lid (lifted, tilted) -->
  <g transform="rotate(-5 60 54)">
    <rect x="16" y="46" width="88" height="15" rx="1.5" fill="#d9483a" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <rect x="53" y="46" width="14" height="15" fill="#f4c542" stroke="#1c1b22" stroke-width="2.5"/>
    <path d="M22 50 L48 50" stroke="#f08a74" stroke-width="2" stroke-linecap="round"/>
    <!-- bow -->
    <g stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
      <path d="M60 44 C48 24 30 28 34 40 C36 46 48 46 60 44 Z" fill="#f4c542"/>
      <path d="M60 44 C72 24 90 28 86 40 C84 46 72 46 60 44 Z" fill="#f4c542"/>
      <path d="M58 46 L48 58 L54 58 L58 52 Z M62 46 L72 58 L66 58 L62 52 Z" fill="#e0a722"/>
      <ellipse cx="60" cy="44" rx="6" ry="5" fill="#e0a722"/>
    </g>
    <path d="M40 34 C44 31 49 32 52 36" fill="none" stroke="#fff6c8" stroke-width="2" stroke-linecap="round"/>
  </g>
  <use href="#bill" transform="translate(60 118) rotate(6)"/>
  <!-- calendar page -->
  <g transform="rotate(9 130 70)">
    <rect x="108" y="40" width="44" height="54" rx="2" fill="#f4f1ea" stroke="#1c1b22" stroke-width="3"/>
    <rect x="108" y="40" width="44" height="15" fill="#c0392b" stroke="#1c1b22" stroke-width="3"/>
    <text x="130" y="51" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#fff" text-anchor="middle" textLength="36" lengthAdjust="spacingAndGlyphs">ELECTION</text>
    <text x="130" y="80" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#1c1b22" text-anchor="middle" textLength="36" lengthAdjust="spacingAndGlyphs">DAY</text>
    <ellipse cx="130" cy="74" rx="20" ry="13" fill="none" stroke="#d6362b" stroke-width="2" transform="rotate(-6 130 74)"/>
    <g fill="#555a66" stroke="#1c1b22" stroke-width="1.5">
      <rect x="116" y="36" width="4" height="8" rx="2"/>
      <rect x="140" y="36" width="4" height="8" rx="2"/>
    </g>
  </g>
</svg>
