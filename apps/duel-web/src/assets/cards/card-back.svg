  <text x="60" y="137" font-family="Georgia, serif" font-weight="bold" font-size="12" fill="#e0b84a" text-anchor="middle" letter-spacing="3">PALACIO</text>
  <text x="60" y="149" font-family="Georgia, serif" font-style="italic" font-size="7" fill="#c9a227" text-anchor="middle" opacity="0.85">duelo politico</text>
