  <circle cx="60" cy="80" r="31" fill="none" stroke="#c9a227" stroke-width="0.8" stroke-dasharray="2 2"/>
  <!-- palace -->
  <g fill="#e0b84a" stroke="#1a2446" stroke-width="1">
    <path d="M60 52 C50 52 45 60 45 66 L75 66 C75 60 70 52 60 52 Z"/>
