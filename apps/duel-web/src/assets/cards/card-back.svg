<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2c3b66"/>
      <stop offset="1" stop-color="#121a33"/>
    </radialGradient>
    <pattern id="diamonds" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M6 0 L12 6 L6 12 L0 6 Z" fill="none" stroke="#c9a227" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="120" height="170" fill="url(#bg)"/>
