    <rect x="42" y="75" width="4" height="18"/>
    <rect x="50" y="75" width="4" height="18"/>
    <rect x="58" y="75" width="4" height="18"/>
    <rect x="66" y="75" width="4" height="18"/>
    <rect x="74" y="75" width="4" height="18"/>
    <rect x="38" y="93" width="44" height="4"/>
    <rect x="35" y="97" width="50" height="4"/>
