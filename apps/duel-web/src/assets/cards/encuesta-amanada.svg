  <path d="M134 3 L137.5 9 L144 7 L143 14 L149 17 L143 21 L145 28 L138 26 L134 31 L130 26 L123 28 L125 21 L119 17 L125 14 L124 7 L130.5 9 Z" fill="#ffd54a" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
