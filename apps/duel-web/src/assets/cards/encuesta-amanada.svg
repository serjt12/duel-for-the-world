  <rect x="31" y="27" width="78" height="86" fill="#fbf6e8" stroke="#1c1b22" stroke-width="2.5"/>
  <rect x="54" y="12" width="32" height="12" rx="3" fill="#b8bcc6" stroke="#1c1b22" stroke-width="2.5"/>
