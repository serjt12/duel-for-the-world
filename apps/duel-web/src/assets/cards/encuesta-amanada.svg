  <path d="M128.5 47 L127 35 L138 40" fill="none" stroke="#1c1b22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M128.5 47 L127 35 L138 40" fill="none" stroke="#ffd54a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
