    <text x="80" y="52.5" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#c0392b" text-anchor="middle" textLength="56" lengthAdjust="spacingAndGlyphs">Re: Fwd: DELETE THIS</text>
    <circle cx="80" cy="40" r="4" fill="#c0392b" stroke="#1c1b22" stroke-width="1.5"/>
    <path d="M48 22 L60 22" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
