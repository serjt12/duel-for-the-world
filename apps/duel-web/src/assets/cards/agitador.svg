<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#f2a65a"/>
      <stop offset="1" stop-color="#b8432f"/>
    </radialGradient>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- sunburst -->
  <g fill="#ffffff" opacity="0.12">
    <polygon points="70,60 40,0 60,0"/>
    <polygon points="70,60 90,0 110,0"/>
    <polygon points="70,60 140,0 160,10"/>
    <polygon points="70,60 0,20 0,45"/>
    <polygon points="70,60 160,50 160,75"/>
    <polygon points="70,60 0,90 0,115"/>
  </g>
  <!-- flying flyers -->
  <g stroke="#1c1b22" stroke-width="2" stroke-linejoin="round">
    <rect x="40" y="8" width="18" height="23" fill="#fdf6e3" transform="rotate(-18 49 19)"/>
    <rect x="128" y="96" width="16" height="20" fill="#fdf6e3" transform="rotate(22 136 106)"/>
    <rect x="18" y="80" width="15" height="19" fill="#ffe08a" transform="rotate(12 25 90)"/>
  </g>
  <g stroke="#b8432f" stroke-width="1.5" stroke-linecap="round">
    <g transform="rotate(-18 49 19)"><line x1="44" y1="14" x2="54" y2="14"/><line x1="44" y1="19" x2="54" y2="19"/><line x1="44" y1="24" x2="51" y2="24"/></g>
  </g>
  <!-- body / t-shirt -->
  <path d="M34 120 C36 98 48 90 66 88 L80 88 C98 90 108 98 110 120 Z" fill="#c0392b" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M62 88 L72 100 L82 88" fill="none" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- raised fist (left) -->
  <path d="M40 98 L24 62" stroke="#1c1b22" stroke-width="13" stroke-linecap="round"/>
  <path d="M40 98 L24 62" stroke="#c68652" stroke-width="8" stroke-linecap="round"/>
  <rect x="13" y="42" width="20" height="20" rx="6" fill="#c68652" stroke="#1c1b22" stroke-width="3"/>
  <path d="M17 48 L29 48 M17 54 L29 54" stroke="#1c1b22" stroke-width="1.8" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="64" y="78" width="16" height="12" fill="#a86d42" stroke="#1c1b22" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="72" cy="56" rx="24" ry="27" fill="#c68652" stroke="#1c1b22" stroke-width="3"/>
  <!-- hair -->
  <path d="M49 50 C48 32 62 26 74 27 C88 28 97 36 95 50 C90 42 82 40 72 40 C62 40 54 43 49 50 Z" fill="#2b1d16" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <!-- bandana -->
  <path d="M48 46 C58 40 86 40 96 46 L96 53 C86 47 58 47 48 53 Z" fill="#e74c3c" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M49 49 L38 44 L40 54 Z M49 50 L37 58 L45 60 Z" fill="#e74c3c" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="60" cy="49" r="1.4" fill="#fff"/>
  <circle cx="72" cy="47" r="1.4" fill="#fff"/>
  <circle cx="84" cy="49" r="1.4" fill="#fff"/>
  <!-- angry brows + eyes -->
  <path d="M58 57 L67 60 M86 57 L77 60" stroke="#1c1b22" stroke-width="3" stroke-linecap="round"/>
  <circle cx="63" cy="63" r="2.6" fill="#1c1b22"/>
  <circle cx="81" cy="63" r="2.6" fill="#1c1b22"/>
  <!-- shouting mouth -->
  <ellipse cx="73" cy="74" rx="7" ry="6" fill="#5a1414" stroke="#1c1b22" stroke-width="2.5"/>
  <path d="M68 71 L78 71" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- megaphone -->
  <g stroke="#1c1b22" stroke-width="3" stroke-linejoin="round">
    <path d="M92 66 L92 78 L134 96 L134 46 Z" fill="#f4c542"/>
    <ellipse cx="134" cy="71" rx="6" ry="25" fill="#e0a722"/>
    <rect x="86" y="66" width="8" height="12" rx="2" fill="#555a66"/>
    <path d="M104 80 L100 96 L110 96 L112 83" fill="#555a66"/>
  </g>
  <path d="M100 68 L126 58" stroke="#fff6c8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- sound waves -->
  <g fill="none" stroke="#fffbe6" stroke-width="3" stroke-linecap="round">
    <path d="M144 58 Q150 71 144 84"/>
    <path d="M151 50 Q160 71 151 92"/>
  </g>
