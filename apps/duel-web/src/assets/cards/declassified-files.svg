<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#5d6b7c"/>
      <stop offset="1" stop-color="#171d25"/>
    </radialGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#000" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <rect width="160" height="120" fill="url(#dots)"/>
  <!-- lamp light -->
  <path d="M40 0 L120 0 L150 120 L10 120 Z" fill="#fff6c8" opacity="0.07"/>
  <g transform="rotate(-6 76 62)">
    <!-- folder back + tab -->
    <path d="M18 22 L18 108 L130 108 L130 22 L64 22 L58 14 L26 14 L20 22 Z" fill="#c9974a" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <!-- paper -->
    <rect x="28" y="18" width="94" height="84" fill="#f4f1ea" stroke="#1c1b22" stroke-width="2.5"/>
    <g stroke="#8c8577" stroke-width="2" stroke-linecap="round">
      <line x1="36" y1="48" x2="56" y2="48"/>
      <line x1="36" y1="58" x2="112" y2="58"/>
      <line x1="36" y1="76" x2="112" y2="76"/>
    </g>
    <!-- redaction bars -->
    <rect x="60" y="45" width="52" height="7" fill="#111"/>
    <!-- peeling bar -->
    <path d="M36 64 L74 64 L74 71 L36 71 Z" fill="#111"/>
    <path d="M74 64 C84 58 94 50 104 50 L102 60 C94 60 84 66 74 71 Z" fill="#3a3a44" stroke="#1c1b22" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="80" y="73" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="9" fill="#c0392b" textLength="28" lengthAdjust="spacingAndGlyphs">ALIENS</text>
    <!-- folder front flap (lower) -->
    <path d="M14 84 L134 84 L130 108 L18 108 Z" fill="#dcae5e" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <path d="M22 88 L126 88" stroke="#f0cf8a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- stamp -->
  <g transform="rotate(-12 70 30)" opacity="0.92">
    <rect x="30" y="25" width="72" height="17" rx="2" fill="none" stroke="#d6362b" stroke-width="3"/>
    <text x="66" y="38" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="12" fill="#d6362b" text-anchor="middle" textLength="64" lengthAdjust="spacingAndGlyphs">CLASSIFIED</text>
  </g>
  <!-- magnifying glass -->
  <g stroke="#1c1b22" stroke-linejoin="round">
    <path d="M110 84 L136 110" stroke-width="11" stroke-linecap="round"/>
    <path d="M110 84 L136 110" stroke="#6b3f1f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="96" cy="68" r="18" fill="#bfe3f2" fill-opacity="0.35" stroke="#e0a722" stroke-width="5"/>
    <circle cx="96" cy="68" r="15.5" fill="none" stroke-width="1.5"/>
    <circle cx="96" cy="68" r="20.5" fill="none" stroke-width="2"/>
  </g>
  <path d="M85 60 C87 55 91 52 96 51" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</svg>
