<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.6" r="0.8">
      <stop offset="0" stop-color="#2f7f7a"/>
      <stop offset="1" stop-color="#0a2528"/>
    </radialGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#000" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <rect width="160" height="120" fill="url(#dots)"/>
  <!-- tent card on tabletop -->
  <g stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
    <path d="M44 30 L54 6 L106 6 L116 30 Z" fill="#dcd6c6"/>
    <path d="M40 30 L52 4 L108 4 L120 30 Z" fill="#f4f1ea"/>
  </g>
  <text x="80" y="16" font-family="Georgia, serif" font-weight="bold" font-size="8" fill="#1c1b22" text-anchor="middle" textLength="36" lengthAdjust="spacingAndGlyphs">PUBLIC</text>
  <text x="80" y="26" font-family="Georgia, serif" font-weight="bold" font-size="8" fill="#1c1b22" text-anchor="middle" textLength="50" lengthAdjust="spacingAndGlyphs">MEETING</text>
  <path d="M56 8 L60 8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- tabletop -->
  <rect x="-4" y="30" width="168" height="11" fill="#7a4a24" stroke="#1c1b22" stroke-width="3"/>
  <path d="M4 33.5 L150 33.5" stroke="#a36a3b" stroke-width="2" stroke-linecap="round"/>
  <!-- under-table shadow -->
  <rect x="0" y="41" width="160" height="10" fill="#000" opacity="0.28"/>
  <!-- legs -->
  <g fill="#5c3518" stroke="#1c1b22" stroke-width="2.5">
    <rect x="8" y="41" width="10" height="79"/>
    <rect x="142" y="41" width="10" height="79"/>
  </g>
  <!-- left sleeve (navy) -->
  <path d="M-4 104 L-4 76 L50 64 L56 88 Z" fill="#2c3a5c" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M4 82 L46 72" stroke="#4a5c86" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 62 L56 60 L63 86 L55 88 Z" fill="#f4f1ea" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="57" cy="74" r="1.8" fill="#e0a722" stroke="#1c1b22" stroke-width="1"/>
  <!-- right sleeve (grey pinstripe) -->
  <path d="M164 102 L164 74 L108 62 L102 86 Z" fill="#5a5f6b" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M150 72 L154 96 M136 69 L140 93 M122 66 L126 90" stroke="#8a909c" stroke-width="1" />
  <path d="M110 60 L102 58 L96 84 L104 86 Z" fill="#f4f1ea" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- envelope -->
  <g transform="rotate(8 80 88)">
    <rect x="64" y="72" width="32" height="34" rx="3" fill="#e8d7a8" stroke="#1c1b22" stroke-width="2.5"/>
    <rect x="68" y="66" width="10" height="10" fill="#8fd18a" stroke="#1c1b22" stroke-width="1.8" transform="rotate(-12 73 71)"/>
    <rect x="80" y="65" width="10" height="10" fill="#7cc377" stroke="#1c1b22" stroke-width="1.8" transform="rotate(10 85 70)"/>
    <path d="M66 94 L80 86 L94 94" fill="none" stroke="#b8a070" stroke-width="2" stroke-linecap="round"/>
    <text x="80" y="104" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#2e6b3a" text-anchor="middle">$$$</text>
  </g>
  <!-- left hand (palm) -->
  <path d="M58 64 L78 61 C82 61 84 65 82 69 L80 82 C74 86 64 86 58 84 Z" fill="#d9a066" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- right hand wrapping over -->
  <path d="M103 58 L86 57 C81 57 78 61 78 64 L78 80 C82 83 96 84 100 82 Z" fill="#a8703e" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#a8703e" stroke="#1c1b22" stroke-width="2">
    <rect x="63" y="63" width="21" height="5.5" rx="2.7"/>
    <rect x="62" y="68.5" width="22" height="5.5" rx="2.7"/>
    <rect x="63" y="74" width="21" height="5.5" rx="2.7"/>
    <rect x="65" y="79.5" width="18" height="5" rx="2.5"/>
  </g>
  <!-- left thumb over the top -->
  <path d="M64 64 C68 54 82 51 92 55 C95 57 93 61 89 61 C82 60 74 62 69 67 Z" fill="#d9a066" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M72 58 C76 56 80 55 84 55" fill="none" stroke="#f0c48e" stroke-width="1.8" stroke-linecap="round"/>
  <!-- sweat drops -->
  <g fill="#bfe3f2" stroke="#1c1b22" stroke-width="1.5">
    <path d="M40 52 C42 56 44 58 42 60 C40 62 37 60 38 57 Z"/>
    <path d="M122 50 C124 54 126 56 124 58 C122 60 119 58 120 55 Z"/>
  </g>
</svg>
