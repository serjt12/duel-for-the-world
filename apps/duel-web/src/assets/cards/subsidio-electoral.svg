<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#d9e85c"/>
      <stop offset="1" stop-color="#5e8a1e"/>
    </radialGradient>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- sunburst -->
  <g fill="#ffffff" opacity="0.14">
    <polygon points="100,80 60,0 84,0"/>
    <polygon points="100,80 118,0 142,0"/>
    <polygon points="100,80 160,18 160,44"/>
    <polygon points="100,80 0,24 0,50"/>
    <polygon points="100,80 0,96 0,120 10,120"/>
  </g>
  <!-- coins -->
  <g fill="#f4c542" stroke="#1c1b22" stroke-width="1.5">
    <circle cx="12" cy="76" r="5"/>
    <circle cx="150" cy="60" r="4.5"/>
    <circle cx="22" cy="108" r="4"/>
  </g>
  <!-- giant cheque -->
  <g transform="rotate(-9 52 40)">
    <rect x="4" y="16" width="94" height="48" rx="3" fill="#f3f8e4" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <rect x="4" y="16" width="94" height="10" fill="#3d8a4a" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <text x="51" y="24.2" font-family="Georgia, serif" font-weight="bold" font-size="7" fill="#f3f8e4" text-anchor="middle" textLength="54" lengthAdjust="spacingAndGlyphs">BONO DEL PUEBLO</text>
    <rect x="10" y="32" width="46" height="24" rx="2" fill="#ffffff" stroke="#1c1b22" stroke-width="2"/>
    <text x="33" y="51" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" fill="#2e7a3a" text-anchor="middle" textLength="40" lengthAdjust="spacingAndGlyphs">$$$</text>
    <g stroke="#9a9384" stroke-width="2" stroke-linecap="round">
      <line x1="62" y1="36" x2="92" y2="36"/>
      <line x1="62" y1="43" x2="88" y2="43"/>
    </g>
    <path d="M62 56 C66 48 68 58 72 52 C75 47 78 57 82 51 C85 48 88 54 92 50" fill="none" stroke="#1d3fa0" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- calendar page -->
  <g transform="rotate(7 136 28)">
    <rect x="118" y="8" width="36" height="40" rx="2" fill="#fbf6e8" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="118" y="8" width="36" height="10" fill="#d2322d" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#555a66" stroke="#1c1b22" stroke-width="1.2"><rect x="124" y="4" width="4" height="8" rx="1.5"/><rect x="144" y="4" width="4" height="8" rx="1.5"/></g>
    <text x="136" y="40" font-family="Georgia, serif" font-weight="bold" font-size="17" fill="#1c1b22" text-anchor="middle">13</text>
    <ellipse cx="136" cy="34" rx="13" ry="10.5" fill="none" stroke="#d2322d" stroke-width="2.5" transform="rotate(-10 136 34)"/>
  </g>
  <!-- goods poking out of the bag -->
  <g stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
    <!-- baguette -->
    <rect x="72" y="36" width="12" height="40" rx="6" fill="#e0a45a" transform="rotate(-20 78 56)"/>
    <!-- rice bag -->
    <path d="M92 40 L102 36 L110 38 L118 36 L120 72 L90 72 Z" fill="#ffffff"/>
    <!-- bananas -->
    <path d="M110 58 C112 44 122 34 134 34 C128 40 122 50 120 62 Z" fill="#f7d93a"/>
    <path d="M114 60 C118 50 128 44 140 46 C132 50 126 56 124 64 Z" fill="#f2c522"/>
  </g>
  <rect x="94" y="46" width="20" height="8" fill="#e23b2e" stroke="#1c1b22" stroke-width="1.5"/>
  <text x="104" y="52.4" font-family="Arial, sans-serif" font-weight="bold" font-size="5.5" fill="#fff" text-anchor="middle" textLength="16" lengthAdjust="spacingAndGlyphs">ARROZ</text>
  <g stroke="#1c1b22" stroke-width="1.4" stroke-linecap="round">
    <line x1="76" y1="44" x2="80" y2="40"/><line x1="78" y1="52" x2="83" y2="48"/>
  </g>
  <!-- paper grocery bag -->
  <path d="M68 64 L136 64 L140 116 L64 116 Z" fill="#c9955a" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M68 64 L136 64 L136.8 72 L67.3 72 Z" fill="#b07d45" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M74 78 L73 110" stroke="#e2b882" stroke-width="2.5" stroke-linecap="round"/>
  <!-- VOTE sticker -->
  <g transform="rotate(-12 104 94)">
    <circle cx="104" cy="94" r="17" fill="#e23b2e" stroke="#1c1b22" stroke-width="2.5"/>
    <circle cx="104" cy="94" r="13" fill="none" stroke="#fff6c8" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="104" y="98.5" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="11" fill="#fff6c8" text-anchor="middle" textLength="24" lengthAdjust="spacingAndGlyphs">¡VOTE!</text>
  </g>
</svg>
