<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#e05a3a"/>
      <stop offset="1" stop-color="#6e1414"/>
    </radialGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#000" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <rect width="160" height="120" fill="url(#dots)"/>
  <!-- camera flashes -->
  <g fill="#fffbe6" stroke="#1c1b22" stroke-width="1.5" stroke-linejoin="round">
    <path d="M18 18 L23 30 L36 28 L26 36 L32 48 L20 40 L10 48 L14 36 L4 28 L16 30 Z"/>
    <path d="M144 6 L148 16 L158 15 L150 21 L154 31 L145 25 L137 31 L140 21 L132 15 L142 16 Z"/>
  </g>
  <!-- newspaper -->
  <g transform="rotate(-7 82 62)">
    <path d="M36 12 L128 12 L128 112 L36 112 Z" fill="#f2eee3" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <text x="82" y="24" font-family="Georgia, serif" font-weight="bold" font-size="9" fill="#1c1b22" text-anchor="middle" textLength="80" lengthAdjust="spacingAndGlyphs">EL CHISME DIARIO</text>
    <line x1="40" y1="28" x2="124" y2="28" stroke="#1c1b22" stroke-width="1.5"/>
    <line x1="40" y1="30" x2="124" y2="30" stroke="#1c1b22" stroke-width="0.8"/>
    <text x="82" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="13" fill="#c0392b" text-anchor="middle" textLength="82" lengthAdjust="spacingAndGlyphs">¡ESCÁNDALO!</text>
    <!-- photo with censored figure -->
    <rect x="42" y="52" width="44" height="40" fill="#bdb6a4" stroke="#1c1b22" stroke-width="2"/>
    <circle cx="64" cy="67" r="9" fill="#4a4540"/>
    <path d="M48 92 C50 80 56 76 64 76 C72 76 78 80 80 92 Z" fill="#4a4540"/>
    <rect x="52" y="63" width="24" height="6" fill="#111"/>
    <!-- text columns -->
    <g stroke="#8c8577" stroke-width="2" stroke-linecap="round">
      <line x1="92" y1="56" x2="122" y2="56"/>
      <line x1="92" y1="62" x2="118" y2="62"/>
      <line x1="92" y1="68" x2="122" y2="68"/>
      <line x1="92" y1="74" x2="114" y2="74"/>
      <line x1="92" y1="80" x2="122" y2="80"/>
      <line x1="92" y1="86" x2="120" y2="86"/>
      <line x1="44" y1="100" x2="122" y2="100"/>
      <line x1="44" y1="106" x2="104" y2="106"/>
    </g>
  </g>
  <!-- old-school camera -->
  <g transform="translate(0 70)">
    <g stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
      <rect x="118" y="18" width="36" height="24" rx="3" fill="#2b2f36"/>
      <rect x="126" y="12" width="14" height="7" rx="1.5" fill="#3a3f4a"/>
      <circle cx="136" cy="30" r="8" fill="#555a66"/>
      <circle cx="136" cy="30" r="4" fill="#1c1b22"/>
      <rect x="144" y="8" width="9" height="5" fill="#f4f1ea"/>
    </g>
    <circle cx="134" cy="28" r="1.5" fill="#cfe8ff"/>
  </g>
</svg>
