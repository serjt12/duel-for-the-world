<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#2f8f88"/>
      <stop offset="1" stop-color="#0c2d31"/>
    </radialGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#000" opacity="0.2"/>
    </pattern>
    <g id="sheet">
      <rect x="-9" y="-12" width="18" height="24" fill="#fbf6e8" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-5 -6 L5 -6 M-5 -1 L5 -1 M-5 4 L2 4" stroke="#9a9384" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <rect width="160" height="120" fill="url(#dots)"/>
  <!-- flying documents -->
  <use href="#sheet" transform="translate(98 14) rotate(20)"/>
  <use href="#sheet" transform="translate(130 22) rotate(-14)"/>
  <use href="#sheet" transform="translate(116 46) rotate(34)"/>
  <!-- envelope -->
  <g transform="rotate(-10 56 70)">
    <!-- back + open flap -->
    <rect x="12" y="48" width="84" height="56" fill="#c99a4c" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12 48 L54 20 L96 48 Z" fill="#d9ab5c" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <!-- documents bursting out -->
    <rect x="26" y="30" width="30" height="36" fill="#fbf6e8" stroke="#1c1b22" stroke-width="2" transform="rotate(-14 41 48)"/>
    <rect x="50" y="24" width="30" height="38" fill="#ffffff" stroke="#1c1b22" stroke-width="2" transform="rotate(12 65 43)"/>
    <g stroke="#9a9384" stroke-width="1.5" stroke-linecap="round" transform="rotate(12 65 43)">
      <line x1="55" y1="32" x2="75" y2="32"/><line x1="55" y1="38" x2="75" y2="38"/><line x1="55" y1="44" x2="70" y2="44"/>
    </g>
    <!-- front pocket -->
    <path d="M12 56 L54 80 L96 56 L96 104 L12 104 Z" fill="#e3b96b" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12 104 L44 80 M96 104 L64 80" stroke="#b8893f" stroke-width="2" stroke-linecap="round"/>
    <!-- stamp -->
    <g transform="rotate(-8 54 92)">
      <rect x="21" y="84" width="66" height="15" rx="2" fill="#fbf6e8" fill-opacity="0.3" stroke="#d2322d" stroke-width="3"/>
      <text x="54" y="95.2" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="9" fill="#d2322d" text-anchor="middle" textLength="58" lengthAdjust="spacingAndGlyphs">CONFIDENCIAL</text>
    </g>
    <!-- crack -->
    <path d="M22 104 L25 98 L21 94 L26 88" fill="none" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- leak drips -->
  <g fill="#8fe3ef" stroke="#1c1b22" stroke-width="1.8" stroke-linejoin="round">
    <path d="M30 104 C30 108 26 110 26 113 C26 116 34 116 34 113 C34 110 30 108 30 104 Z"/>
    <path d="M40 110 C40 112 38 113 38 115 C38 117 42 117 42 115 C42 113 40 112 40 110 Z"/>
  </g>
  <!-- folded newspaper catching them -->
  <g transform="rotate(8 128 92)">
    <path d="M100 68 L156 68 L156 116 L100 116 Z" fill="#f2eee3" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
    <path d="M100 68 L108 62 L160 62 L156 68" fill="#d8d2c2" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="128" y="78" font-family="Georgia, serif" font-weight="bold" font-size="7" fill="#1c1b22" text-anchor="middle" textLength="46" lengthAdjust="spacingAndGlyphs">LA PRENSA</text>
    <line x1="104" y1="81" x2="152" y2="81" stroke="#1c1b22" stroke-width="1.5"/>
    <text x="128" y="93" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="10" fill="#c0392b" text-anchor="middle" textLength="48" lengthAdjust="spacingAndGlyphs">¡FILTRADO!</text>
    <g stroke="#8c8577" stroke-width="2" stroke-linecap="round">
      <line x1="104" y1="100" x2="152" y2="100"/><line x1="104" y1="106" x2="146" y2="106"/><line x1="104" y1="112" x2="150" y2="112"/>
    </g>
  </g>
  <!-- sparkles -->
  <g fill="#fff6c8">
    <path d="M146 44 L147.5 48.5 L152 50 L147.5 51.5 L146 56 L144.5 51.5 L140 50 L144.5 48.5 Z"/>
    <path d="M10 16 L11.5 20.5 L16 22 L11.5 23.5 L10 28 L8.5 23.5 L4 22 L8.5 20.5 Z"/>
  </g>
</svg>
