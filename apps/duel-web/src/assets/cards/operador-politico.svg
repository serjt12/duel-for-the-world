<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f64"/>
      <stop offset="1" stop-color="#10262a"/>
    </linearGradient>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- venetian-blind shadow stripes -->
  <g fill="#000" opacity="0.18">
    <rect x="0" y="8" width="160" height="7"/>
    <rect x="0" y="24" width="160" height="7"/>
    <rect x="0" y="40" width="160" height="7"/>
    <rect x="0" y="56" width="160" height="7"/>
    <rect x="0" y="72" width="160" height="7"/>
  </g>
  <!-- suit -->
  <path d="M28 120 C30 96 44 88 60 86 L76 86 C92 88 104 96 106 120 Z" fill="#2b2f36" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 86 L68 104 L76 86 Z" fill="#e9e6de" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M66 92 L70 92 L72 116 L68 120 L64 116 Z" fill="#8e2b2b" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
  <!-- phone arm (left) -->
  <path d="M36 104 L40 70" stroke="#1c1b22" stroke-width="13" stroke-linecap="round"/>
  <path d="M36 104 L40 70" stroke="#2b2f36" stroke-width="8" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="61" y="76" width="14" height="11" fill="#b77c52" stroke="#1c1b22" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="68" cy="54" rx="22" ry="25" fill="#d49a6a" stroke="#1c1b22" stroke-width="3"/>
  <!-- slicked hair -->
  <path d="M46 50 C44 32 56 26 70 26 C84 26 92 34 90 48 C86 38 76 36 66 38 C58 39 50 42 46 50 Z" fill="#141414" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M58 32 Q70 28 84 34" fill="none" stroke="#5a5a5a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- sunglasses -->
  <g stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
    <path d="M50 53 L66 53 L64 62 L53 62 Z" fill="#111"/>
    <path d="M71 53 L87 53 L85 62 L74 62 Z" fill="#111"/>
    <path d="M66 55 L71 55"/>
  </g>
  <path d="M54 55 L58 55 M75 55 L79 55" stroke="#6fd3c2" stroke-width="1.6" stroke-linecap="round"/>
  <!-- thin mustache + smirk -->
  <path d="M58 68 Q64 65 68 67 Q72 65 78 68" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M61 73 Q70 76 77 71" fill="none" stroke="#1c1b22" stroke-width="2.6" stroke-linecap="round"/>
  <!-- phone -->
  <g stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round">
    <rect x="38" y="48" width="11" height="21" rx="2.5" fill="#3a3f4a" transform="rotate(-12 43 58)"/>
    <circle cx="42" cy="70" r="6" fill="#d49a6a"/>
  </g>
  <!-- puppeteer arm (right) -->
  <path d="M98 104 L114 50" stroke="#1c1b22" stroke-width="13" stroke-linecap="round"/>
  <path d="M98 104 L114 50" stroke="#2b2f36" stroke-width="8" stroke-linecap="round"/>
  <circle cx="115" cy="44" r="6" fill="#d49a6a" stroke="#1c1b22" stroke-width="2.5"/>
  <!-- control bar -->
  <g stroke="#1c1b22" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="38" x2="136" y2="38" stroke-width="5"/>
    <line x1="100" y1="38" x2="136" y2="38" stroke="#b07a3a" stroke-width="2.5"/>
    <line x1="118" y1="28" x2="118" y2="50" stroke-width="5"/>
    <line x1="118" y1="28" x2="118" y2="50" stroke="#b07a3a" stroke-width="2.5"/>
  </g>
  <!-- strings -->
  <g stroke="#e9e6de" stroke-width="1" opacity="0.85">
    <line x1="101" y1="39" x2="126" y2="92"/>
    <line x1="135" y1="39" x2="146" y2="92"/>
    <line x1="118" y1="50" x2="136" y2="78"/>
  </g>
  <!-- tiny puppet politician -->
  <g stroke="#1c1b22" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="136" cy="82" r="6" fill="#f1c9a0"/>
    <path d="M128 118 L130 96 C131 90 141 90 142 96 L144 118 Z" fill="#8a8f99"/>
    <path d="M130 97 L126 92 M142 97 L146 92" fill="none"/>
    <path d="M136 90 L136 100" stroke="#c0392b" stroke-width="2.5"/>
    <path d="M133 83 L134 83 M138 83 L139 83" />
    <path d="M133 86 Q136 88 139 86" fill="none"/>
  </g>
</svg>
