  <rect x="47" y="102" width="38" height="16" rx="2" fill="#fdf6e3" stroke="#1c1b22" stroke-width="2.2"/>
  <text x="66" y="113.5" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#1c1b22" text-anchor="middle" textLength="30" lengthAdjust="spacingAndGlyphs">INTERN</text>
  <!-- left arm raised with coffee -->
  <path d="M32 106 L22 64" stroke="#1c1b22" stroke-width="13" stroke-linecap="round"/>
  <path d="M32 106 L22 64" stroke="#e8eef2" stroke-width="8" stroke-linecap="round"/>
  <g transform="rotate(16 22 46)">
