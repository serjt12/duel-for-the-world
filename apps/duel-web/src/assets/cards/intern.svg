  <use href="#fold" fill="#6fa8dc" transform="translate(120 102) rotate(-3)"/>
  <use href="#fold" fill="#e06b5a" transform="translate(116 92) rotate(4)"/>
  <use href="#fold" fill="#8fcf7a" transform="translate(121 82) rotate(-5)"/>
  <use href="#fold" fill="#f2c86b" transform="translate(118 72) rotate(3)"/>
  <use href="#fold" fill="#6fa8dc" transform="translate(124 62) rotate(-7)"/>
  <use href="#fold" fill="#e06b5a" transform="translate(128 52) rotate(-2)"/>
  <use href="#fold" fill="#8fcf7a" transform="translate(134 42) rotate(-12)"/>
  <!-- wobble lines -->
  <g fill="none" stroke="#fffbe6" stroke-width="2.5" stroke-linecap="round">
    <path d="M110 34 Q106 40 108 46"/>
    <path d="M158 38 Q160 44 157 52"/>
