  <path d="M57 70 Q60 67 63 70 Q66 73 69 70 Q72 67 75 70" fill="none" stroke="#1c1b22" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="51" cy="64" r="3.5" fill="#e8847a" opacity="0.5"/>
  <circle cx="83" cy="64" r="3.5" fill="#e8847a" opacity="0.5"/>
