  <path d="M45 50 C44 32 56 26 68 26 C80 26 91 32 90 48 C84 40 72 38 60 42 C54 44 48 48 45 50 Z" fill="#8a5a34" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
