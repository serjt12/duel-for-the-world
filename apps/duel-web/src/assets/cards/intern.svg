  <g stroke="#1c1b22" stroke-width="2"><circle cx="58" cy="55" r="5" fill="#fff"/><circle cx="76" cy="55" r="5" fill="#fff"/></g>
  <circle cx="59" cy="56" r="2.2" fill="#1c1b22"/>
  <circle cx="77" cy="56" r="2.2" fill="#1c1b22"/>
