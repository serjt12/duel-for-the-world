<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#5cc2b4"/>
      <stop offset="1" stop-color="#154d48"/>
    </radialGradient>
    <g id="fold">
      <rect x="-22" y="-5" width="44" height="10" rx="1.5" stroke="#1c1b22" stroke-width="2.2"/>
      <path d="M-18 -1 L16 -1" stroke="#fdf6e3" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <!-- rays -->
  <g fill="#ffffff" opacity="0.1">
    <polygon points="70,54 40,0 58,0"/>
    <polygon points="70,54 84,0 102,0"/>
    <polygon points="70,54 0,20 0,40"/>
    <polygon points="70,54 0,80 0,100"/>
  </g>
  <!-- flying papers -->
