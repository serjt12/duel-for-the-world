    <rect x="10" y="29" width="24" height="6" rx="2" fill="#555a66" stroke="#1c1b22" stroke-width="2.2"/>
  </g>
  <rect x="14" y="56" width="16" height="13" rx="5" fill="#f0c8a0" stroke="#1c1b22" stroke-width="2.5"/>
