<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#e45cc0"/>
      <stop offset="1" stop-color="#4a1f7a"/>
    </radialGradient>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#fff" opacity="0.14"/>
    </pattern>
    <path id="heart" d="M0 6 C-10 -1 -8 -9 -3 -9 C-1 -9 0 -7 0 -6 C0 -7 1 -9 3 -9 C8 -9 10 -1 0 6 Z" fill="#ff4f7b" stroke="#1c1b22" stroke-width="2" stroke-linejoin="round"/>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
  <rect width="160" height="120" fill="url(#dots)"/>
  <!-- ring light -->
  <circle cx="72" cy="54" r="36" fill="#fff" opacity="0.14"/>
  <circle cx="72" cy="54" r="40" fill="none" stroke="#1c1b22" stroke-width="11"/>
  <circle cx="72" cy="54" r="40" fill="none" stroke="#fff8fd" stroke-width="6"/>
  <!-- back hair -->
  <path d="M46 56 C42 30 58 22 72 22 C88 22 102 30 98 56 C100 72 104 86 101 98 L43 98 C40 86 44 72 46 56 Z" fill="#3b1f2b" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <!-- body / top -->
  <path d="M30 120 C32 98 46 90 62 88 L82 88 C98 90 110 98 112 120 Z" fill="#3fc1c9" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M63 88 C66 96 78 96 81 88" fill="#e8b48a" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- neck -->
  <rect x="65" y="76" width="14" height="13" fill="#d99f76" stroke="#1c1b22" stroke-width="3"/>
  <!-- head -->
  <ellipse cx="72" cy="56" rx="22" ry="25" fill="#e8b48a" stroke="#1c1b22" stroke-width="3"/>
  <!-- bangs -->
  <path d="M49 54 C47 34 60 28 74 28 C88 28 97 38 95 52 C88 42 78 38 68 40 C60 42 53 47 49 54 Z" fill="#3b1f2b" stroke="#1c1b22" stroke-width="3" stroke-linejoin="round"/>
  <path d="M62 32 C70 30 80 32 86 36" fill="none" stroke="#e45cc0" stroke-width="3" stroke-linecap="round"/>
  <!-- earring -->
  <circle cx="50" cy="67" r="3.5" fill="none" stroke="#f4c542" stroke-width="2"/>
  <!-- brows + eyes with lashes -->
  <path d="M58 50 Q63 47 68 50 M76 50 Q81 47 86 50" fill="none" stroke="#3b1f2b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="63" cy="57" r="2.8" fill="#1c1b22"/>
  <circle cx="81" cy="57" r="2.8" fill="#1c1b22"/>
  <path d="M59 55 L57 53 M85 55 L87 53" stroke="#1c1b22" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="56" r="0.9" fill="#fff"/>
  <circle cx="82" cy="56" r="0.9" fill="#fff"/>
  <!-- blush -->
  <circle cx="57" cy="65" r="4" fill="#ff6fa0" opacity="0.5"/>
  <circle cx="87" cy="65" r="4" fill="#ff6fa0" opacity="0.5"/>
  <!-- big smile -->
  <path d="M61 66 Q72 82 83 66 Q72 69 61 66 Z" fill="#7a1a3a" stroke="#1c1b22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M63 67.5 Q72 70.5 81 67.5 L80 70 Q72 72.5 64 70 Z" fill="#fff"/>
  <!-- arm + selfie stick -->
  <path d="M100 104 L117 76" stroke="#1c1b22" stroke-width="13" stroke-linecap="round"/>
  <path d="M100 104 L117 76" stroke="#e8b48a" stroke-width="8" stroke-linecap="round"/>
  <path d="M119 74 L136 38" stroke="#1c1b22" stroke-width="6" stroke-linecap="round"/>
  <path d="M119 74 L136 38" stroke="#b8bcc6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="119" cy="73" r="7" fill="#e8b48a" stroke="#1c1b22" stroke-width="2.5"/>
  <path d="M114 71 L122 67 M114 75 L123 71" stroke="#1c1b22" stroke-width="1.5" stroke-linecap="round"/>
  <!-- phone -->
  <g transform="rotate(15 140 23)">
    <rect x="130" y="6" width="20" height="32" rx="3.5" fill="#2b2f36" stroke="#1c1b22" stroke-width="2.5"/>
    <rect x="133" y="10" width="14" height="23" rx="1.5" fill="#ffb3de"/>
    <use href="#heart" transform="translate(140 22) scale(0.5)"/>
    <path d="M135 13 L139 12" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- floating likes -->
  <use href="#heart" transform="translate(20 44) scale(1.2)"/>
  <use href="#heart" transform="translate(28 74) scale(0.8)"/>
  <use href="#heart" transform="translate(146 70) scale(0.9)"/>
  <use href="#heart" transform="translate(114 22) scale(0.7)"/>
  <path d="M15 38 Q17 35 20 35" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- LIVE tag -->
  <rect x="5" y="5" width="32" height="14" rx="3" fill="#e8243c" stroke="#1c1b22" stroke-width="2"/>
  <circle cx="11.5" cy="12" r="2.5" fill="#fff"/>
  <text x="25" y="15.3" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#fff" text-anchor="middle">LIVE</text>
</svg>
