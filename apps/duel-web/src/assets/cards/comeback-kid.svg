      <path d="M64 68 C54 62 46 56 40 48 C46 48 48 44 48 40 C52 46 56 50 64 56 Z" fill="#ffe07a" stroke="none"/>
    </g>
  </defs>
  <rect width="160" height="120" fill="url(#bg)"/>
