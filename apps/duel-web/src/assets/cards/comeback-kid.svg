  <circle cx="100" cy="46" r="4.5" fill="#f0c3a0" stroke="#1c1b22" stroke-width="2.5"/>
  <ellipse cx="80" cy="43" rx="20" ry="22" fill="#f0c3a0" stroke="#1c1b22" stroke-width="3"/>
