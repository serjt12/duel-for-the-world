  <text x="80" y="113" font-family="Georgia, serif" font-weight="bold" font-size="10" fill="#3a2418" text-anchor="middle" textLength="44" lengthAdjust="spacingAndGlyphs">CAREER</text>
  <g fill="#e0a722" stroke="#1c1b22" stroke-width="1.5">
