# fly.toml app configuration file generated for project-palacio on 2026-09-26T03:54:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'project-palacio'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
